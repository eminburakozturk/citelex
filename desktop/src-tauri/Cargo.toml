[package]
name = "citelex"
version = "0.1.0"
description = "Citelex — Türk Mevzuatı RAG İstemcisi"
authors = ["Citelex"]
edition = "2021"

[lib]
name = "citelex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
