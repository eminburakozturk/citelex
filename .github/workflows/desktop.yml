name: Desktop & Mobile Build

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "NEXT_PUBLIC_API_URL (bulut API adresi)"
        required: false
        default: "http://127.0.0.1:8000"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web bağımlılıklarını kur
        run: npm --prefix web ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri CLI kur
        run: cargo install tauri-cli --locked

      - name: Windows EXE/MSI derle
        working-directory: desktop
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || 'http://127.0.0.1:8000' }}
        run: |
          node csp-config.mjs
          cargo tauri build --config src-tauri/tauri.csp.json

      - name: Windows artefaktlarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: citelex-windows
          path: |
            desktop/src-tauri/target/release/citelex.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web bağımlılıklarını kur
        run: npm --prefix web ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Android NDK ve SDK 37 kur/ayarla
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-37" "build-tools;35.0.0" >/dev/null
          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            yes | sdkmanager "ndk;28.2.13676358" >/dev/null
            echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          else
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri CLI kur
        run: cargo install tauri-cli --locked

      - name: Android arm64 release APK derle (imzasız)
        working-directory: desktop
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || 'http://127.0.0.1:8000' }}
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            cargo tauri android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew
          node csp-config.mjs
          cargo tauri android build --apk --target aarch64 --split-per-abi --config src-tauri/tauri.csp.json

      - name: Android APK artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: citelex-android-arm64
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
