name: Desktop Build (Windows)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "NEXT_PUBLIC_API_URL (bulut API adresi)"
        required: false
        default: "http://127.0.0.1:8000"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web bağımlılıklarını kur
        run: npm --prefix web ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tauri CLI kur
        run: cargo install tauri-cli --locked

      - name: Windows EXE/MSI derle
        working-directory: desktop
        env:
          NEXT_PUBLIC_API_URL: ${{ inputs.api_url || 'http://127.0.0.1:8000' }}
        run: cargo tauri build

      - name: Artefaktları yükle
        uses: actions/upload-artifact@v4
        with:
          name: citelex-windows
          path: |
            desktop/src-tauri/target/release/citelex.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
