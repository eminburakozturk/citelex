name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Model/torch kurulmaz: testler sahte LLM ile, kapı bellek içi BM25 ile çalışır.
      - run: pip install fastapi==0.162.5 httpx==0.28.1 qdrant-client==1.20.0 numpy==2.4.6 pdfplumber==0.11.10 lxml==6.1.3 cssselect==1.6.0 langgraph==1.2.21 pytest
      - name: Birim testleri
        run: python -m pytest tests -q
      - name: Arama regresyonu kapısı (BM25, eval/gate_baseline.json)
        run: python -m eval.gate

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Playwright Chromium kurulumu
        run: npx --prefix web playwright install --with-deps chromium
      - name: Arayüz uçtan uca testleri (sahte API)
        run: npm --prefix web run test:e2e
