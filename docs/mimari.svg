<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Citelex Mimari Şeması</title>
  <desc id="desc">Kaynaklardan güncelleme hattına, parçalamaya, Qdrant indeksine, hibrit arama ve reranker aşamasına, eşik kontrolüne, LLM ve atıf doğrulamasına, FastAPI SSE API ucundan istemcilere uzanan akış ile değerlendirme ve izlenebilirlik yan bileşenleri.</desc>
  <style>
    :root {
      --bg: #f7f6f3;
      --box: #ffffff;
      --box-soft: #f3e6e4;
      --box-side: #f2f1ed;
      --ink: #1c1b19;
      --muted: #5c5952;
      --line: #b8b3a8;
      --accent: #7a2e2e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151412;
        --box: #1e1d1a;
        --box-soft: #3a2623;
        --box-side: #242320;
        --ink: #ece9e2;
        --muted: #a8a399;
        --line: #524f47;
        --accent: #e0a39b;
      }
    }
    svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .bg { fill: var(--bg); }
    .card { fill: var(--box); stroke: var(--line); stroke-width: 1.4; rx: 8; ry: 8; }
    .card-accent { fill: var(--box-soft); stroke: var(--accent); stroke-width: 1.5; rx: 8; ry: 8; }
    .card-side { fill: var(--box-side); stroke: var(--line); stroke-width: 1.4; stroke-dasharray: 5 3; rx: 8; ry: 8; }
    .h { fill: var(--ink); font-size: 13px; font-weight: 600; }
    .s { fill: var(--muted); font-size: 11px; }
    .tag { fill: var(--accent); font-size: 11px; font-weight: 600; }
    .arr { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .arr-accent { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#arrow-accent); }
    .arr-dash { stroke: var(--line); stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--line)" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--accent)" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="540" rx="10" />

  <!-- Bölüm etiketleri -->
  <text class="tag" x="28" y="28">VERİ &amp; İNDEKS HATTI</text>
  <text class="tag" x="28" y="218">SORGU &amp; DOĞRULAMA HATTI</text>
  <text class="tag" x="720" y="28">KALİTE &amp; İZLEME</text>

  <!-- Satır 1: Kaynaklar -> Güncelleme -> Parçalama -> İndeks -->
  <rect class="card" x="28" y="44" width="164" height="104" />
  <text class="h" x="42" y="66">Kaynaklar</text>
  <text class="s" x="42" y="86">• mevzuat.gov.tr (PDF)</text>
  <text class="s" x="42" y="102">• kvkk.gov.tr (40 karar)</text>
  <text class="s" x="42" y="118">• Resmî Gazete (fihrist)</text>
  <text class="s" x="42" y="134">• HF corpus (899 kanun)</text>

  <line class="arr" x1="192" y1="96" x2="220" y2="96" />

  <rect class="card" x="224" y="44" width="154" height="104" />
  <text class="h" x="238" y="66">Güncelleme Hattı</text>
  <text class="s" x="238" y="86">• SQLite sürüm deposu</text>
  <text class="s" x="238" y="102">• Madde/bölüm farkı</text>
  <text class="s" x="238" y="118">• Erken uyarı günlüğü</text>
  <text class="s" x="238" y="134">• Artımlı upsert</text>

  <line class="arr" x1="378" y1="96" x2="406" y2="96" />

  <rect class="card" x="410" y="44" width="128" height="104" />
  <text class="h" x="424" y="66">Parçalama</text>
  <text class="s" x="424" y="86">• Madde / fıkra</text>
  <text class="s" x="424" y="102">• Hibrit (1500 kr.)</text>
  <text class="s" x="424" y="118">• Mülga bayrağı</text>
  <text class="s" x="424" y="134">• Karar bölümleri</text>

  <line class="arr" x1="538" y1="96" x2="566" y2="96" />

  <rect class="card-accent" x="570" y="44" width="128" height="104" />
  <text class="h" x="584" y="66">İndeks (Qdrant)</text>
  <text class="s" x="584" y="86">• bge-m3 dense</text>
  <text class="s" x="584" y="102">• BM25 sparse (TR)</text>
  <text class="s" x="584" y="118">• Payload filtreleri</text>
  <text class="s" x="584" y="134">• Emb. önbelleği</text>

  <!-- İndeks -> Hibrit arama bağlantısı -->
  <path class="arr-accent" d="M 634 148 L 634 184 L 106 184 L 106 232" />

  <!-- Satır 2: Hibrit Arama -> Eşik -> LLM -> Atıf Doğrulama -->
  <rect class="card" x="28" y="236" width="156" height="92" />
  <text class="h" x="42" y="258">Hibrit Arama</text>
  <text class="s" x="42" y="278">• İki kanallı (mevzuat</text>
  <text class="s" x="42" y="294">  + karar), RRF k=60</text>
  <text class="s" x="42" y="312">• + bge-reranker-v2-m3</text>

  <line class="arr" x1="184" y1="282" x2="210" y2="282" />

  <rect class="card-accent" x="214" y="236" width="136" height="92" />
  <text class="h" x="228" y="258">Eşik Kontrolü</text>
  <text class="s" x="228" y="278">• dense top-1 ≥ 0.637</text>
  <text class="s" x="228" y="294">• Kalibrasyon ayrı</text>
  <text class="s" x="228" y="312">• Altı → "bilmiyorum"</text>

  <line class="arr" x1="350" y1="282" x2="376" y2="282" />

  <rect class="card" x="380" y="236" width="156" height="92" />
  <text class="h" x="394" y="258">LLM Üretimi</text>
  <text class="s" x="394" y="278">• OpenRouter zinciri</text>
  <text class="s" x="394" y="294">• Gemini / Ollama</text>
  <text class="s" x="394" y="312">• Tek adım | LangGraph</text>

  <line class="arr" x1="536" y1="282" x2="562" y2="282" />

  <rect class="card-accent" x="566" y="236" width="132" height="92" />
  <text class="h" x="580" y="258">Atıf Doğrulama</text>
  <text class="s" x="580" y="278">• Geçerli [n] kontrolü</text>
  <text class="s" x="580" y="294">• CEVAP_YOK yakalar</text>
  <text class="s" x="580" y="312">• Kaynak metni bağlar</text>

  <!-- Satır 3: API (SSE) -> İstemciler -->
  <line class="arr-accent" x1="632" y1="328" x2="632" y2="380" />

  <rect class="card" x="456" y="384" width="242" height="108" />
  <text class="h" x="472" y="408">FastAPI (SSE + REST)</text>
  <text class="s" x="472" y="428">• POST /sor (akışlı cevap + ?mod=ajan)</text>
  <text class="s" x="472" y="444">• GET /kaynak · /saglik</text>
  <text class="s" x="472" y="460">• GET /degisiklikler · /degisiklik/{id}</text>
  <text class="s" x="472" y="476">• IP / günlük istek sınırı</text>

  <line class="arr" x1="456" y1="438" x2="416" y2="438" />

  <rect class="card" x="28" y="384" width="384" height="108" />
  <text class="h" x="44" y="408">İstemciler &amp; Araçlar (src/tools.py)</text>
  <text class="s" x="44" y="430">• Web (Next.js statik çıktı): sohbet, /pano, /degisiklikler</text>
  <text class="s" x="44" y="448">• MCP Sunucusu (src/mcp_server.py): mevzuat_ara, madde_getir</text>
  <text class="s" x="44" y="466">• Tauri 2 (planlanan): Windows EXE + Android APK</text>

  <!-- Yan Kutu: Değerlendirme ve İzlenebilirlik -->
  <rect class="card-side" x="720" y="44" width="212" height="236" />
  <text class="h" x="736" y="70">Değerlendirme</text>
  <text class="s" x="736" y="92">• Eval seti: 56 soru (50 içi, 6 dışı)</text>
  <text class="s" x="736" y="110">• Kalibrasyon seti: 30 soru (ayrı)</text>
  <text class="s" x="736" y="128">• LLM hakem (claude-haiku-5.5)</text>
  <text class="s" x="736" y="146">  tam destekli sadakat ölçütü</text>
  <text class="s" x="736" y="164">• CI arama regresyonu kapısı</text>
  <text class="s" x="736" y="182">  (BM25 bellek içi, GitHub Actions)</text>
  <text class="s" x="736" y="200">• Sonuçlar → results/ + /pano</text>

  <rect class="card-side" x="720" y="302" width="212" height="190" />
  <text class="h" x="736" y="328">İzlenebilirlik</text>
  <text class="s" x="736" y="350">• OpenTelemetry (src/trace.py)</text>
  <text class="s" x="736" y="368">  sor → arama, llm span ağacı</text>
  <text class="s" x="736" y="386">• Jaeger UI (Compose profili)</text>
  <text class="s" x="736" y="404">• logs/izler.jsonl tek satır özet</text>
  <text class="s" x="736" y="422">• Gecikme, token ve maliyet</text>

  <line class="arr-dash" x1="698" y1="282" x2="716" y2="160" />
  <line class="arr-dash" x1="698" y1="438" x2="716" y2="392" />
</svg>
